<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElevenLabs Speech-to-Text</title>
  <style>
    /* ── Design tokens ──────────────────────────────────────── */
    :root {
      --bg:       #0f172a;
      --card:     #1e293b;
      --border:   #334155;
      --text:     #f1f5f9;
      --muted:    #94a3b8;
      --green:    #10b981;
      --red:      #ef4444;
      --blue:     #3b82f6;
      --indigo:   #6366f1;
      --sky:      #38bdf8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 28px 16px 60px;
    }

    .page { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    /* ── Header ─────────────────────────────────────────────── */
    .header {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 10px;
    }
    .header h1 { font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }

    .badges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 5px 12px; border-radius: 999px; font-size: 0.82rem; font-weight: 600;
      background: #334155; color: var(--muted);
    }
    .badge.recording { background: rgba(239,68,68,.18); color: #fca5a5; border: 1px solid rgba(239,68,68,.4); }
    .badge.timer     { background: rgba(99,102,241,.15); color: #a5b4fc; border: 1px solid rgba(99,102,241,.3); }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
    .badge.recording .dot { animation: blink 1s infinite alternate; }
    @keyframes blink { from { opacity:.3; transform: scale(.8); } to { opacity:1; transform: scale(1.2); } }

    /* ── Card ───────────────────────────────────────────────── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px;
    }

    /* ── Form elements ──────────────────────────────────────── */
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }

    label {
      font-size: 0.78rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: .06em; color: var(--muted);
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; }

    input, select {
      flex: 1; min-width: 0;
      padding: 10px 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg);
      color: var(--text); font-size: .95rem; outline: none;
      transition: border-color .15s;
    }
    input:focus, select:focus { border-color: var(--blue); }

    /* ── Buttons ─────────────────────────────────────────────── */
    button {
      cursor: pointer; border: none; border-radius: 8px;
      padding: 10px 16px; font-size: .9rem; font-weight: 600;
      display: inline-flex; align-items: center; gap: 6px;
      transition: opacity .15s, transform .1s;
    }
    button:active:not(:disabled) { transform: scale(.97); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .btn-gray   { background: #334155; color: var(--text); }
    .btn-green  { background: var(--green); color: #fff; }
    .btn-red    { background: var(--red);   color: #fff; }
    .btn-indigo { background: var(--indigo); color: #fff; }
    .btn-sm     { padding: 5px 10px; font-size: .78rem; }

    .btn-gray:hover:not(:disabled)   { background: #475569; }
    .btn-green:hover:not(:disabled)  { background: #059669; }
    .btn-red:hover:not(:disabled)    { background: #dc2626; }
    .btn-indigo:hover:not(:disabled) { background: #4f46e5; }

    /* ── Mic level bar ──────────────────────────────────────── */
    .meter { height: 7px; background: var(--bg); border-radius: 4px; overflow: hidden; margin-top: 14px; border: 1px solid var(--border); }
    #meterFill { height: 100%; width: 0%; background: var(--green); transition: width .08s; }

    /* ── Transcript ─────────────────────────────────────────── */
    .tx-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
    }
    .tx-meta { display: flex; flex-direction: column; gap: 3px; }
    #segLabel { color: var(--indigo); font-size: .8rem; margin-top: 2px; }
    #txStats  { color: var(--muted); font-size: .8rem; }

    #transcriptBox {
      min-height: 160px; max-height: 340px; overflow-y: auto;
      padding: 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); line-height: 1.7; white-space: pre-wrap;
      overflow-wrap: anywhere; font-size: 1rem;
      transition: border-color .3s;
    }
    #transcriptBox.flash { border-color: var(--indigo); }

    .empty   { color: var(--muted); font-style: italic; }
    .partial { color: var(--sky);   font-style: italic; }

    /* ── Segment history ─────────────────────────────────────── */
    .history-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
    }
    #historyList { display: flex; flex-direction: column; gap: 10px; max-height: 260px; overflow-y: auto; }
    .seg-item {
      background: var(--bg); border: 1px solid var(--border);
      border-left: 3px solid var(--indigo); border-radius: 6px;
      padding: 10px 12px; font-size: .9rem; line-height: 1.6;
    }
    .seg-meta {
      display: flex; justify-content: space-between; align-items: center;
      font-size: .75rem; color: var(--muted); margin-bottom: 4px;
    }
    .empty-hist { color: var(--muted); font-style: italic; font-size: .85rem; }

    /* ── Log ─────────────────────────────────────────────────── */
    details { margin-top: 14px; color: var(--muted); font-size: .85rem; }
    summary { cursor: pointer; user-select: none; }
    #logBox {
      margin-top: 8px; max-height: 140px; overflow-y: auto;
      padding: 10px; background: #090d16; border-radius: 6px;
      font-family: monospace; font-size: .78rem;
    }
    .le { margin-bottom: 4px; }
    .le.err  { color: #f87171; }
    .le.ok   { color: #4ade80; }
    .le.info { color: #a5b4fc; }
  </style>
</head>
<body>
<div class="page">

  <!-- Header -->
  <header class="header">
    <h1>🎙️ ElevenLabs Speech-to-Text</h1>
    <div class="badges">
      <div id="timerBadge" class="badge timer" style="display:none">
        ⏱️ Flush in: <span id="timerText">02:00</span>
      </div>
      <div id="statusBadge" class="badge">
        <span class="dot"></span>
        <span id="statusText">Idle</span>
      </div>
    </div>
  </header>

  <!-- Config card -->
  <section class="card">

    <div class="field">
      <label for="apiKey">ElevenLabs API Key</label>
      <div class="row">
        <input type="password" id="apiKey" placeholder="Paste your xi-api-key here…" autocomplete="off">
        <button type="button" id="toggleKey" class="btn-gray">Show</button>
      </div>
    </div>

    <div class="field">
      <label for="deviceSelect">Microphone</label>
      <div class="row">
        <select id="deviceSelect"><option value="">Default Microphone</option></select>
        <button type="button" id="refreshDevices" class="btn-gray">🔄 Refresh</button>
      </div>
    </div>

    <div class="field">
      <label for="flushSelect">Auto-Flush Interval</label>
      <select id="flushSelect">
        <option value="120000" selected>Every 2 minutes (default)</option>
        <option value="60000">Every 1 minute</option>
        <option value="30000">Every 30 seconds (testing)</option>
        <option value="300000">Every 5 minutes</option>
        <option value="0">Disabled</option>
      </select>
    </div>

    <div class="row" style="margin-top:4px">
      <button id="recordBtn" class="btn-green">🎙️ Start Recording</button>
      <button id="stopBtn"   class="btn-red"   disabled>⏹️ Stop</button>
      <button id="flushBtn"  class="btn-indigo" disabled title="Flush now and keep recording">⚡ Flush Now</button>
    </div>

    <div class="meter"><div id="meterFill"></div></div>
    <p style="color:var(--muted);font-size:.75rem;margin-top:6px">Microphone level</p>

  </section>

  <!-- Live transcript card -->
  <section class="card">

    <div class="tx-header">
      <div class="tx-meta">
        <label>Live Transcript</label>
        <div id="segLabel">Segment 1</div>
        <div id="txStats">0 words</div>
      </div>
      <div class="row">
        <button id="copyBtn"  class="btn-gray btn-sm">📋 Copy</button>
        <button id="clearBtn" class="btn-gray btn-sm">🗑️ Clear</button>
      </div>
    </div>

    <div id="transcriptBox" aria-live="polite">
      <span class="empty">Press "Start Recording" and speak into your microphone.</span>
    </div>

  </section>

  <!-- History card -->
  <section class="card">

    <div class="history-header">
      <label>Flushed Segments — <span id="histCount">0</span></label>
      <button id="copyAllBtn" class="btn-gray btn-sm" disabled>📋 Copy All</button>
    </div>

    <div id="historyList">
      <span class="empty-hist">
        Completed 2-minute segments will appear here while recording continues.
      </span>
    </div>

    <details>
      <summary>Debug log</summary>
      <div id="logBox"></div>
    </details>

  </section>

</div><!-- /page -->

<script type="module">
  import { ElevenLabsSTT } from './stt.js';

  // ── DOM refs ──────────────────────────────────────────────────────────────
  const apiKeyEl      = document.getElementById('apiKey');
  const toggleKeyBtn  = document.getElementById('toggleKey');
  const deviceSel     = document.getElementById('deviceSelect');
  const refreshBtn    = document.getElementById('refreshDevices');
  const flushSel      = document.getElementById('flushSelect');

  const recordBtn     = document.getElementById('recordBtn');
  const stopBtn       = document.getElementById('stopBtn');
  const flushBtn      = document.getElementById('flushBtn');

  const meterFill     = document.getElementById('meterFill');
  const txBox         = document.getElementById('transcriptBox');
  const segLabel      = document.getElementById('segLabel');
  const txStats       = document.getElementById('txStats');
  const copyBtn       = document.getElementById('copyBtn');
  const clearBtn      = document.getElementById('clearBtn');

  const historyList   = document.getElementById('historyList');
  const histCount     = document.getElementById('histCount');
  const copyAllBtn    = document.getElementById('copyAllBtn');

  const statusBadge   = document.getElementById('statusBadge');
  const statusText    = document.getElementById('statusText');
  const timerBadge    = document.getElementById('timerBadge');
  const timerText     = document.getElementById('timerText');
  const logBox        = document.getElementById('logBox');

  // ── State ─────────────────────────────────────────────────────────────────
  const segments = [];          // archived flushed segments
  let   tickInterval = null;    // countdown ticker ID

  // ── Logging ──────────────────────────────────────────────────────────────
  function log(msg, type = '') {
    const d = document.createElement('div');
    d.className = `le ${type}`;
    d.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
    logBox.appendChild(d);
    logBox.scrollTop = logBox.scrollHeight;
  }

  // ── API key persistence ───────────────────────────────────────────────────
  const SK = 'elevenlabs_stt_key';
  const saved = localStorage.getItem(SK);
  if (saved) {
    apiKeyEl.value = saved;
  } else {
    // Try to pre-load from the local server's /api/config endpoint
    fetch('/api/config')
      .then(r => r.ok ? r.json() : null)
      .then(cfg => {
        if (cfg?.apiKey && !apiKeyEl.value) {
          apiKeyEl.value = cfg.apiKey;
          localStorage.setItem(SK, cfg.apiKey);
          log('API key loaded from .env via server.', 'ok');
        }
      })
      .catch(() => log('Enter your ElevenLabs API key above.'));
  }

  apiKeyEl.addEventListener('input', () => localStorage.setItem(SK, apiKeyEl.value.trim()));

  toggleKeyBtn.addEventListener('click', () => {
    const hide = apiKeyEl.type === 'password';
    apiKeyEl.type = hide ? 'text' : 'password';
    toggleKeyBtn.textContent = hide ? 'Hide' : 'Show';
  });

  // ── Device list ───────────────────────────────────────────────────────────
  async function loadDevices() {
    try {
      const prev = deviceSel.value;
      const list = await ElevenLabsSTT.getAudioDevices();

      deviceSel.replaceChildren();
      const def = Object.assign(document.createElement('option'), { value: '', textContent: 'Default Microphone' });
      deviceSel.appendChild(def);

      list.forEach(d => {
        const o = Object.assign(document.createElement('option'), { value: d.deviceId, textContent: d.label });
        deviceSel.appendChild(o);
      });

      if (list.some(d => d.deviceId === prev)) deviceSel.value = prev;
      log(`Found ${list.length} microphone(s).`, 'ok');
    } catch (err) {
      log(`Microphone list error: ${err.message}`, 'err');
    }
  }

  refreshBtn.addEventListener('click', loadDevices);
  loadDevices();

  // ── STT instance ──────────────────────────────────────────────────────────
  const stt = new ElevenLabsSTT({
    autoFlushMs: Number(flushSel.value),

    onTranscript({ committed, partial }) {
      renderTx(committed, partial);
    },

    onStatusChange(status, detail) {
      updateStatus(status, detail);
    },

    onVolume(v) {
      meterFill.style.width = `${Math.round(v * 100)}%`;
    },

    onFlush({ flushedText, segmentIndex, timestamp }) {
      archiveSegment(flushedText, segmentIndex, timestamp);
    },

    onError(err) {
      log(`ERROR: ${err.message}`, 'err');
      // Don't alert — the error is visible in the log
    },
  });

  // ── Flush interval selector ───────────────────────────────────────────────
  flushSel.addEventListener('change', () => {
    const ms = Number(flushSel.value);
    stt.setAutoFlushMs(ms);
    if (stt.isRecording) startTicker();
    log(`Auto-flush interval set to ${ms ? ms / 1000 + 's' : 'disabled'}.`);
  });

  // ── Status display ────────────────────────────────────────────────────────
  function updateStatus(status, detail = '') {
    statusBadge.className = 'badge' + (status === 'recording' ? ' recording' : '');
    statusText.textContent =
      status === 'recording' ? '🔴 Recording'
      : status === 'connecting' ? (detail || 'Connecting…')
      : status === 'stopped'   ? 'Stopped'
      : status === 'error'     ? '⚠️ Error'
      : 'Idle';

    const active = status === 'recording';
    recordBtn.disabled   = (status === 'connecting' || active);
    stopBtn.disabled     = !(status === 'connecting' || active);
    flushBtn.disabled    = !active;
    deviceSel.disabled   = active;
    meterFill.style.width = active ? meterFill.style.width : '0%';

    if (active) {
      segLabel.textContent = `Segment ${stt.segmentIndex}`;
      startTicker();
    } else {
      stopTicker();
    }

    log(`Status → ${status}${detail ? ` (${detail})` : ''}`);
  }

  // ── Transcript rendering ──────────────────────────────────────────────────
  function renderTx(committed = '', partial = '') {
    txBox.replaceChildren();

    if (!committed && !partial) {
      txBox.innerHTML = '<span class="empty">Listening for speech…</span>';
      txStats.textContent = '0 words';
      return;
    }

    if (committed) {
      txBox.appendChild(Object.assign(document.createElement('span'), { textContent: committed }));
    }
    if (partial) {
      txBox.appendChild(
        Object.assign(document.createElement('span'), {
          className: 'partial',
          textContent: (committed ? ' ' : '') + partial,
        })
      );
    }

    txBox.scrollTop = txBox.scrollHeight;
    const full  = [committed, partial].filter(Boolean).join(' ');
    const words = full.trim() ? full.trim().split(/\s+/).length : 0;
    txStats.textContent = `${words} word${words === 1 ? '' : 's'} · ${full.length} chars`;
    segLabel.textContent = `Segment ${stt.segmentIndex}`;
  }

  // ── Segment archiving ─────────────────────────────────────────────────────
  function archiveSegment(text, index, timestamp) {
    const trimmed = text.trim();
    const time    = new Date(timestamp).toLocaleTimeString();
    const words   = trimmed ? trimmed.split(/\s+/).length : 0;

    log(`Flushed segment #${index} (${words} words) at ${time}.`, 'info');

    // Visual flash on transcript box
    txBox.classList.add('flash');
    setTimeout(() => txBox.classList.remove('flash'), 500);

    if (!trimmed) return; // don't archive blank segments

    segments.push({ index, text: trimmed, time, words });
    renderHistory();
  }

  function renderHistory() {
    histCount.textContent = segments.length;
    copyAllBtn.disabled   = segments.length === 0;
    historyList.replaceChildren();

    if (segments.length === 0) {
      historyList.innerHTML =
        '<span class="empty-hist">Completed 2-minute segments will appear here while recording continues.</span>';
      return;
    }

    [...segments].reverse().forEach(seg => {
      const item = document.createElement('div');
      item.className = 'seg-item';

      const meta = document.createElement('div');
      meta.className = 'seg-meta';
      meta.innerHTML = `<span><strong>Segment #${seg.index}</strong> · ${seg.time} · ${seg.words} words</span>`;

      const copySegBtn = document.createElement('button');
      copySegBtn.className = 'btn-gray btn-sm';
      copySegBtn.style.cssText = 'padding:2px 8px;font-size:.72rem';
      copySegBtn.textContent = '📋 Copy';
      copySegBtn.onclick = async () => {
        await navigator.clipboard.writeText(seg.text);
        copySegBtn.textContent = '✅';
        setTimeout(() => { copySegBtn.textContent = '📋 Copy'; }, 1500);
      };
      meta.appendChild(copySegBtn);

      const body = document.createElement('div');
      body.textContent = seg.text;

      item.append(meta, body);
      historyList.appendChild(item);
    });
  }

  // ── Countdown ticker ──────────────────────────────────────────────────────
  function startTicker() {
    stopTicker();
    const ms = stt.autoFlushMs;
    if (!ms) { timerBadge.style.display = 'none'; return; }

    timerBadge.style.display = 'inline-flex';

    const tick = () => {
      const rem  = stt.msUntilFlush();
      if (rem === null) { timerBadge.style.display = 'none'; return; }
      const secs = Math.ceil(rem / 1000);
      const m    = Math.floor(secs / 60);
      const s    = secs % 60;
      timerText.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    };

    tick();
    tickInterval = setInterval(tick, 1000);
  }

  function stopTicker() {
    if (tickInterval) { clearInterval(tickInterval); tickInterval = null; }
    timerBadge.style.display = 'none';
  }

  // ── Button handlers ───────────────────────────────────────────────────────
  recordBtn.addEventListener('click', async () => {
    const key = apiKeyEl.value.trim();
    if (!key) { alert('Please enter your ElevenLabs API key.'); apiKeyEl.focus(); return; }

    try {
      await stt.start({
        apiKey:      key,
        deviceId:    deviceSel.value || undefined,
        autoFlushMs: Number(flushSel.value),
      });
      log('Recording started.', 'ok');
    } catch (err) {
      log(`Start failed: ${err.message}`, 'err');
    }
  });

  stopBtn.addEventListener('click', async () => {
    try {
      await stt.stop();
      log('Recording stopped.', 'ok');
    } catch (err) {
      log(`Stop failed: ${err.message}`, 'err');
    }
  });

  flushBtn.addEventListener('click', () => {
    if (stt.isRecording) stt.flush();
  });

  copyBtn.addEventListener('click', async () => {
    const txt = stt.getFullTranscript();
    if (!txt) { alert('Nothing to copy yet.'); return; }
    await navigator.clipboard.writeText(txt);
    copyBtn.textContent = '✅ Copied!';
    setTimeout(() => { copyBtn.textContent = '📋 Copy'; }, 1500);
  });

  clearBtn.addEventListener('click', () => {
    stt.clearTranscript();
    renderTx('', '');
    log('Transcript buffer cleared.');
  });

  copyAllBtn.addEventListener('click', async () => {
    const hist = segments.map(s => `[Segment #${s.index} · ${s.time}]\n${s.text}`).join('\n\n');
    const cur  = stt.getFullTranscript();
    const all  = [hist, cur ? `[Segment #${stt.segmentIndex} · current]\n${cur}` : '']
                   .filter(Boolean).join('\n\n');
    if (!all) { alert('Nothing to copy.'); return; }
    await navigator.clipboard.writeText(all);
    copyAllBtn.textContent = '✅ Copied!';
    setTimeout(() => { copyAllBtn.textContent = '📋 Copy All'; }, 1500);
  });
</script>
</body>
</html>
